function homeStarHint(e){if(!e.home||e.isMine)return '';let bal=starBal();return `<p class="small" style="margin-top:10px">⭐ Tham gia kèo tại nhà cần tối thiểu ${STAR_JOIN_HOME}⭐ uy tín — bạn đang có <b>${bal}⭐</b> ${bal>=STAR_JOIN_HOME?'✓ đủ điều kiện':'· chưa đủ sao, đi thêm kèo tại quán trước nhé'}.</p>`}
function starsCard(){let s=state.stars||{bal:0,log:[]};let bal=s.bal||0;let next=bal<STAR_JOIN_HOME?{n:STAR_JOIN_HOME,label:'tham gia kèo tại nhà'}:bal<STAR_HOST_HOME?{n:STAR_HOST_HOME,label:'tạo kèo tại nhà'}:null;let pct=next?Math.min(100,Math.round(bal/next.n*100)):100;let log=(s.log||[]).slice(0,6).map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)"><span style="min-width:0;overflow-wrap:anywhere">${esc(x.txt)}</span><b style="color:${x.d>=0?'#7ee2a8':'#ff8fa3'};white-space:nowrap">${x.d>=0?'+':''}${x.d}⭐</b></div>`).join('');return `<section class="profile-card"><h3 style="margin:0 0 4px">⭐ Sao uy tín · ${bal}⭐</h3><p class="small" style="color:var(--muted);margin:0 0 8px">Sao tích từ hoạt động thật, không giới hạn số sao. Kèo tại nhà có cổng uy tín: tham gia ≥${STAR_JOIN_HOME}⭐ · tạo kèo ≥${STAR_HOST_HOME}⭐.</p>${next?`<div style="height:8px;border-radius:99px;background:#101a2a;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#ef344f,#ffb02e)"></div></div><p class="small" style="margin:6px 0 0">Còn ${next.n-bal}⭐ nữa là đủ để ${next.label}.</p>`:`<p class="small" style="margin:0">Bạn đã mở khoá cả hai mức kèo tại nhà 🎉</p>`}<div style="margin-top:8px">${log||'<p class="small" style="color:var(--muted)">Chưa có biến động sao.</p>'}</div><p class="small" style="color:var(--muted);margin-top:8px">Cách kiếm sao: chủ trì kèo hoàn thành +10 (tại nhà +15) · tới đúng hẹn +5 · giữ bàn cố định +5 · báo về nhà an toàn +2 · xác thực tài khoản +10. Trừ sao: huỷ/rời khẩn cấp −20 · không tới kèo tại nhà −30.</p></section>`}
function safetyPanel(e){let st=statusOf(e);let recent=st==='done'&&(Date.now()-endDT(e).getTime()<4*3600000);if(!(st==='live'||recent))return '';if(!(e.isMine||joinedStatus(e)==='approved'))return '';let hs=(state.homeSafe||{})[e.id];let rides=state.rideFor===e.id?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn secondary sm" href="grab://open" style="text-decoration:none">Grab</a><a class="btn secondary sm" href="be://open" style="text-decoration:none">Be</a><a class="btn secondary sm" href="xanhsm://open" style="text-decoration:none">Xanh SM</a></div><p class="small" style="color:var(--muted);margin-top:6px">Bấm để mở app đặt xe (bản demo dùng liên kết mở app).</p>`:'';return `<div class="postkeo"><h3 style="margin:0 0 4px;font-size:15px">🚕 Về nhà an toàn</h3><p class="small" style="margin:0 0 8px">Kèo ${st==='live'?'đang diễn ra':'vừa kết thúc'} — đã uống là không lái. Đặt xe, báo người thân và cho cả bàn biết khi bạn về tới nhà.</p>${hs?`<p style="font-weight:700">✅ Bạn đã báo về nhà an toàn lúc ${esc(hs)} — cả bàn đã thấy trong chat bàn.</p>`:`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-action="safe-ride" data-id="${esc(e.id)}">🚕 Đặt xe về nhà</button><button class="btn secondary sm" data-action="safe-share" data-id="${esc(e.id)}">📍 Chia sẻ chuyến đi</button><button class="btn secondary sm" data-action="safe-home" data-id="${esc(e.id)}">✅ Tui đã về tới nhà</button></div>${rides}`}</div>`}
const VENUE_TAGS=['Mồi ngon','Giá ổn','Phục vụ tốt','Không gian đẹp','Ồn ào','Hơi đắt'];
const VENUE_SEED_RATINGS={"98 Bùi Viện":[5,4,5],"Bia Hải Xồm":[4,5,4,4]};
function defaultVenueName(e){let vs=VENUES.filter(v=>v.city===e.city);if(!vs.length)vs=VENUES;return (vs.find(v=>v.area===e.area)||vs[0]).name}
function venueAgg(name){let list=[];Object.values(state.venueMine||{}).forEach(vm=>{if(vm.venue===name&&vm.stars>0)list.push(vm.stars)});(VENUE_SEED_RATINGS[name]||[]).forEach(s=>list.push(s));if(!list.length)return{count:0,avg:0};return{count:list.length,avg:list.reduce((a,b)=>a+b,0)/list.length}}
function venueRateSection(e){if(statusOf(e)!=='done')return '';if(!(e.isMine||joinedStatus(e)==='approved'))return '';let vs=VENUES.filter(v=>v.city===e.city);if(!vs.length)vs=VENUES;let vm=(state.venueMine||{})[e.id]||{venue:'',stars:0,tags:[]};let cur=vm.venue||defaultVenueName(e);let stars=[1,2,3,4,5].map(n=>`<button class="starbtn ${vm.stars>=n?'on':''}" data-action="vrate-star" data-id="${esc(e.id)}" data-value="${n}" aria-label="${n} sao">★</button>`).join('');let chips=vs.map(v=>`<button class="chip ${cur===v.name?'active':''}" data-action="vrate-venue" data-id="${esc(e.id)}" data-value="${esc(v.name)}">${esc(v.name)}</button>`).join('');let tags=VENUE_TAGS.map(tg=>`<button class="chip ${(vm.tags||[]).includes(tg)?'active':''}" data-action="vrate-tag" data-id="${esc(e.id)}" data-value="${esc(tg)}">${esc(tg)}</button>`).join('');let agg=venueAgg(cur);return `<div class="postkeo"><h3 style="margin:0 0 4px;font-size:15px">🏠 Chấm điểm quán</h3><p class="small" style="margin:0 0 8px">Kèo này nhậu ở quán nào? Chấm điểm để mục Quán ngon có dữ liệu thật từ cộng đồng.</p><div class="segmented" style="margin-bottom:10px">${chips}</div><div class="stars">${stars}</div><div class="segmented" style="margin-top:10px">${tags}</div><p class="small" style="color:var(--muted);margin-top:8px">Cộng đồng đã chấm quán này: ${agg.count?agg.avg.toFixed(1)+'★ · '+agg.count+' lượt':'chưa có lượt nào — bạn chấm đầu tiên!'}</p></div>`}
function recurSection(e){let st=statusOf(e);let rec=e.seriesId?(state.recurring||{})[e.seriesId]:null;if(rec&&st!=='done')return `<div class="postkeo"><h3 style="margin:0 0 4px;font-size:15px">🔁 Bàn cố định</h3><p class="small" style="margin:0">Bàn này đang được giữ hằng tuần — chuỗi <b>${rec.weeks} tuần</b> liên tiếp. Kèo tuần này chính là bàn đó!</p></div>`;if(st!=='done')return '';if(!(e.isMine||joinedStatus(e)==='approved'))return '';if(rec&&rec.nextId&&rec.nextId!==e.id)return `<div class="postkeo"><h3 style="margin:0 0 4px;font-size:15px">🔁 Bàn cố định</h3><p class="small" style="margin:0">Đã giữ bàn cho tuần sau rồi (chuỗi ${rec.weeks} tuần) — xem kèo mới trong Kèo của tôi.</p></div>`;return `<div class="postkeo"><h3 style="margin:0 0 4px;font-size:15px">🔁 Giữ bàn này hằng tuần?</h3><p class="small" style="margin:0 0 8px">Bàn hợp gu thì giữ luôn: app tạo sẵn kèo y hệt vào tuần sau, cùng giờ, cùng chỗ. Giữ càng lâu chuỗi tuần càng dài.</p><button class="btn primary sm" data-action="recur-keep" data-id="${esc(e.id)}">📌 Giữ bàn này</button>${rec?`<p class="small" style="color:var(--muted);margin-top:6px">Chuỗi hiện tại: ${rec.weeks} tuần liên tiếp.</p>`:''}</div>`}
function detailPage(){let e=state.events.find(x=>x.id===state.detailId);if(!e)return '';let status=joinedStatus(e);return `<div class="detail-page"><div class="backbar"><button class="btn primary" data-action="close-detail">← Quay lại</button><h2 style="font-size:18px;margin:0">Chi tiết kèo</h2><button class="btn secondary sm" data-action="lifecycle" style="margin-left:auto">🔄 Vòng đời kèo</button></div><div class="modal-body">${e.photos&&e.photos.length?`<div class="detail-hero"><img src="${e.photos[0]}" alt="Ảnh kèo">${e.photos[1]?`<img class="hero2" src="${e.photos[1]}" alt="Ảnh kèo 2">`:''}</div>`:`<div class="detail-hero"><span>${esc(e.icon||'🍻')}</span></div>`}<div class="event-type">${esc(e.type)}</div><h2 style="font-size:20px;line-height:1.5;margin:8px 0 12px">${esc(e.title)}</h2><div class="tags" style="margin:0 0 16px">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="detail-grid"><div class="detail-box"><small>📍 Khu vực</small><strong>${esc(e.area)} · ${esc(fmtCity(e.city))}</strong></div><div class="detail-box"><small>🗓 Ngày & giờ (24h)</small><strong>${formatDate(e.date)} · ${esc(e.start)}–${esc(e.end)}${e.end<=e.start?' · qua đêm':''}</strong></div><div class="detail-box"><small>👥 Số chỗ</small><strong>${e.members}/${e.max} người · còn ${spots(e)}</strong></div><div class="detail-box"><small>👥 Đối tượng tham gia</small><strong>${esc(e.audience||'Tất cả')}</strong></div><div class="detail-box"><small>🧾 Hóa đơn</small><strong>${esc(e.bill)}</strong></div><div class="detail-box"><small>🤝 Chủ kèo</small><strong>${esc(e.host)}</strong></div><div class="detail-box"><small>📌 Điểm hẹn dự kiến</small><strong>${esc(placeText(e))}</strong></div></div>${checkinPanel(e)}${homePanel(e)}${homeStarHint(e)}${safetyPanel(e)}${postKeoSection(e)}${venueRateSection(e)}${recurSection(e)}<p class="small" style="line-height:1.85;margin-top:16px">${esc(e.description||'Chưa có mô tả.')}</p>${(state.notices[e.id]||[]).length?`<div class="activity"><h3 style="font-size:14px;margin:18px 0 4px">Hoạt động của kèo</h3>${(state.notices[e.id]||[]).map(n=>`<div class="activity-item">${n.unread?'<span class="dot"></span>':'<span class="dot" style="background:#29354b"></span>'}<span>${esc(n.t)}</span></div>`).join('')}</div>`:''}<div class="inline-note" style="margin-top:13px">🧾 ${esc(BILL[e.bill]||'Vui lòng thống nhất trước khi tham gia.')}</div><div class="detail-actions">${e.isMine?`<button class="btn primary" data-action="chat-table" data-id="${esc(e.id)}">💬 Chat bàn của bạn</button>`:status==='approved'?`<button class="btn primary" data-action="chat-table" data-id="${esc(e.id)}">💬 Chat trong bàn</button>`:status==='pending'?`<button class="btn secondary" disabled>Đã gửi yêu cầu · chờ duyệt</button>`:status==='waitlist'?`<button class="btn secondary" disabled>Đã vào danh sách chờ</button>`:(statusOf(e)==='live'||statusOf(e)==='done'||statusOf(e)==='cancelled')?`<button class="btn secondary" disabled>Kèo đã đóng</button>`:spots(e)===0?`<button class="btn primary" data-action="join" data-id="${esc(e.id)}">Xin vào danh sách chờ</button>`:`<button class="btn primary" data-action="join" data-id="${esc(e.id)}">Xin vào bàn</button>`}<button class="btn outline" data-action="close-detail">Đóng</button></div></div></div>`}
